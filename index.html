<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CINEFILOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;font-family:'Inter',-apple-system,sans-serif;color:#fff;overflow-x:hidden;min-height:100vh}
.screen{display:none;padding-bottom:90px;min-height:100vh}
.screen.active{display:block}
.top-header{padding:18px 22px 12px;display:flex;justify-content:space-between;align-items:center}
.top-header h1{font-size:32px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:12px}
.top-header h1 svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none;cursor:pointer}
.header-right{display:flex;align-items:center;gap:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1c1c1e;border:1.5px solid #2c2c2e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;overflow:hidden;background-size:cover;background-position:center}
.admin-btn{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;border:none;font-size:22px;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
.search-overlay{display:none;margin:0 22px 14px;background:#1c1c1e;border-radius:12px;padding:12px 16px;align-items:center;gap:10px}
.search-overlay.active{display:flex}
.search-overlay svg{width:18px;height:18px;stroke:#8e8e93;stroke-width:2;fill:none;flex-shrink:0}
.search-overlay input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;outline:none;font-family:'Inter',sans-serif}
.search-results{padding:0 22px 30px}
.search-section-title{font-size:14px;font-weight:700;color:#8e8e93;letter-spacing:1px;text-transform:uppercase;margin:20px 0 12px}
.search-empty{text-align:center;padding:60px 22px;color:#8e8e93}
.hero{position:relative;margin:0 16px;height:540px;border-radius:20px;overflow:hidden;background:#0a0a0a}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;transition:opacity .4s ease}
.hero-bg.fade{opacity:0}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.3) 40%,rgba(0,0,0,.85) 75%,#000 100%)}
.hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:24px 22px 28px;text-align:center}
.emmy{margin-bottom:18px}
.emmy-text .year{font-size:12px;letter-spacing:.5px}
.emmy-text .award{font-size:18px;font-weight:700;margin-top:4px}
.tags{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:22px}
.tags .dot{width:3px;height:3px;background:#8e8e93;border-radius:50%}
.tags .age{border:1.5px solid #8e8e93;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:4px}
.appletv-icon{width:18px;height:18px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:9px;font-weight:700}
.actions{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.btn-play{background:#fff;color:#000;border:none;padding:14px 52px;border-radius:50px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-plus{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:26px;cursor:pointer}
.btn-plus.saved{background:#fff;color:#000}
.dots{display:flex;gap:7px;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:all .3s;cursor:pointer}
.dots span.active{background:#fff;width:22px;border-radius:3px}
.section{margin-top:30px;padding:0 22px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-header h2{font-size:22px;font-weight:700;letter-spacing:-.5px}
.section-header .arrow{color:#8e8e93;font-size:22px}
.carousel{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.chart-card{flex:0 0 200px;display:flex;align-items:flex-end;gap:6px}
.chart-number{font-size:80px;font-weight:800;line-height:.8;letter-spacing:-6px;color:#000;-webkit-text-stroke:2px #fff;flex-shrink:0}
.chart-poster{width:110px;height:160px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0;cursor:pointer}
.poster-wide{flex:0 0 280px;height:160px;border-radius:12px;background-size:cover;background-position:center;border:1px solid #1c1c1e;cursor:pointer}
.news-mini{flex:0 0 220px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:12px;overflow:hidden}
.news-mini-img{width:100%;height:120px;background-size:cover;background-position:center}
.news-mini-body{padding:12px 14px}
.news-mini-tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#8e8e93;margin-bottom:6px}
.news-mini-title{font-size:13px;font-weight:600;line-height:1.3}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 22px}
.grid-poster{width:100%;aspect-ratio:2/3;border-radius:12px;background-size:cover;background-position:center;border:1px solid #1c1c1e}
.grid-title{margin-top:8px;font-size:14px;font-weight:600}
.grid-meta{font-size:12px;color:#8e8e93;margin-top:2px}
.tabs{display:flex;gap:8px;padding:0 22px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 18px;border-radius:20px;background:#1c1c1e;color:#8e8e93;font-size:13px;font-weight:600;border:none;font-family:'Inter',sans-serif;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.genres{display:flex;gap:8px;padding:0 22px 20px;overflow-x:auto;scrollbar-width:none}
.genres::-webkit-scrollbar{display:none}
.genre{flex:0 0 auto;padding:8px 14px;border-radius:16px;background:transparent;border:1px solid #2c2c2e;color:#8e8e93;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;white-space:nowrap}
.genre.active{background:#fff;color:#000;border-color:#fff}
.top-rated{margin:0 22px 24px;padding:20px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:18px;display:flex;gap:16px;align-items:center}
.top-rated-poster{width:90px;height:130px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0}
.top-rated-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8e8e93;margin-bottom:6px}
.top-rated-title{font-size:19px;font-weight:700;margin-bottom:8px}
.stars{display:flex;gap:3px;margin-bottom:6px}
.stars svg{width:15px;height:15px}
.rating-num{font-size:12px;color:#ccc}
.comments-title{font-size:15px;font-weight:700;padding:0 22px;margin-bottom:12px}
.comment{margin:0 22px 10px;padding:14px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:14px;display:flex;gap:12px}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.comment-user{font-size:13px;font-weight:600;margin-bottom:4px}
.comment-text{font-size:13px;color:#bbb;line-height:1.5}
.comment-form{margin:0 22px 16px;display:flex;gap:10px}
.comment-form input{flex:1;background:#1c1c1e;border:none;border-radius:20px;padding:12px 16px;color:#fff;font-size:14px;outline:none;font-family:'Inter',sans-serif}
.comment-form button{background:#fff;color:#000;border:none;padding:0 20px;border-radius:20px;font-size:13px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer}
.ranking-item{display:flex;align-items:center;gap:14px;margin:0 22px 10px;padding:10px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:12px}
.ranking-num{font-size:22px;font-weight:800;width:34px;text-align:center;color:#555}
.ranking-poster{width:46px;height:66px;border-radius:6px;background-size:cover;background-position:center}
.ranking-title{font-size:13px;font-weight:600;margin-bottom:4px}
.ranking-rating{font-size:11px;color:#8e8e93}

.profile-avatar-wrap{position:relative;width:110px;height:110px;margin:30px auto 14px;cursor:pointer}
.profile-avatar-wrap::after{content:'+';position:absolute;bottom:2px;right:2px;background:#fff;color:#000;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;line-height:1}
.profile-avatar-lg{width:110px;height:110px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;border:3px solid #2c2c2e;overflow:hidden;background-size:cover;background-position:center}
.profile-display-name{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:linear-gradient(135deg,#2AABEE,#229ED9);border-radius:50%;flex-shrink:0}
.verified-badge svg{width:12px;height:12px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.profile-handle{font-size:13px;color:#8e8e93;margin-bottom:18px;text-align:center}
.profile-bio{font-size:13px;color:#bbb;line-height:1.6;margin:0 22px 18px;padding:12px 16px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:14px;cursor:pointer;position:relative}
.profile-bio::after{content:'✏️ Editar';position:absolute;bottom:8px;right:12px;font-size:9px;color:#636366}
.profile-stats-row{display:flex;justify-content:space-around;padding:16px 22px;margin:0 22px 18px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:16px}
.profile-stat{text-align:center}
.profile-stat-num{font-size:18px;font-weight:800}
.profile-stat-label{font-size:9px;color:#8e8e93;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.profile-tabs{display:flex;justify-content:center;gap:22px;padding:0 22px 14px;border-bottom:1px solid #1c1c1e;margin-bottom:20px}
.profile-tab{padding:8px 4px;background:transparent;border:none;color:#636366;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;position:relative}
.profile-tab.active{color:#fff}
.profile-tab.active::after{content:'';position:absolute;bottom:-14px;left:0;right:0;height:2px;background:#fff}
.profile-section-title{font-size:16px;font-weight:800;padding:0 22px 12px;display:flex;align-items:center;gap:6px}
.profile-section-title .star-icon{color:#FFD700;font-size:14px}
.profile-section-title .see-all{margin-left:auto;font-size:12px;color:#8e8e93;font-weight:600}
.fav-row{display:flex;gap:8px;overflow-x:auto;padding:0 22px 20px;scrollbar-width:none}
.fav-row::-webkit-scrollbar{display:none}
.fav-poster{flex:0 0 90px;height:130px;border-radius:8px;background-size:cover;background-position:center;cursor:pointer}
.rating-card{margin:0 22px 12px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.rating-card-poster{width:60px;height:90px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0}
.rating-card-info{flex:1}
.rating-card-label{font-size:10px;color:#8e8e93;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.rating-card-title{font-size:15px;font-weight:700;margin-bottom:6px}
.rating-card-stars{display:flex;gap:2px;margin-bottom:4px}
.rating-card-stars svg{width:14px;height:14px}
.rating-card-time{font-size:11px;color:#8e8e93}
.detail-back{position:absolute;top:20px;left:20px;z-index:10;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(20px);border:none;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.detail-hero{position:relative;height:480px;background-size:cover;background-position:center 20%}
.detail-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,transparent 30%,rgba(0,0,0,.9) 85%,#000 100%)}
.detail-content{position:relative;z-index:2;padding:24px 22px}
.detail-title{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-bottom:14px;margin-top:-80px}
.detail-meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.detail-chip{padding:5px 12px;background:#1c1c1e;border-radius:10px;font-size:11px;color:#bbb;font-weight:600}
.detail-chip.year{background:#fff;color:#000}
.detail-synopsis-title{font-size:11px;font-weight:700;color:#8e8e93;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px}
.detail-synopsis{font-size:14px;line-height:1.7;color:#ddd;margin-bottom:26px}
.detail-rating-row{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:14px;margin-bottom:26px}
.detail-rating-stars{display:flex;gap:2px}
.detail-rating-stars svg{width:18px;height:18px}
.detail-rating-info{flex:1}
.detail-rating-value{font-size:18px;font-weight:800;line-height:1}
.detail-rating-count{font-size:11px;color:#8e8e93;margin-top:4px}
.episode-title{font-size:16px;font-weight:700;padding:0 22px;margin-bottom:12px}
.season-tabs{display:flex;gap:8px;padding:0 22px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.season-tabs::-webkit-scrollbar{display:none}
.season-tab{flex:0 0 auto;padding:8px 16px;border-radius:16px;background:#1c1c1e;color:#8e8e93;font-size:12px;font-weight:600;border:none;font-family:'Inter',sans-serif;white-space:nowrap}
.season-tab.active{background:#fff;color:#000}
.episodes-carousel{display:flex;gap:12px;overflow-x:auto;padding:0 22px 10px;scrollbar-width:none}
.episodes-carousel::-webkit-scrollbar{display:none}
.episode{flex:0 0 200px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:12px;overflow:hidden;cursor:pointer}
.episode-img{width:100%;height:110px;background-size:cover;background-position:center}
.episode-info{padding:10px 12px}
.episode-num{font-size:10px;color:#8e8e93;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.episode-name{font-size:13px;font-weight:600;line-height:1.3}
.related-title{font-size:16px;font-weight:700;padding:0 22px;margin:26px 0 14px}
.related-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 22px 40px}
.related-item{cursor:pointer}
.related-poster{width:100%;aspect-ratio:2/3;border-radius:10px;background-size:cover;background-position:center;border:1px solid #1c1c1e;margin-bottom:6px}
.related-name{font-size:11px;font-weight:600;line-height:1.3}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-top:1px solid #1c1c1e;display:flex;justify-content:space-around;align-items:center;padding:10px 4px 16px;z-index:999}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;color:#636366;flex:1;padding:6px 4px;border:none;background:transparent;font-family:'Inter',sans-serif}
.nav-item.active{color:#fff}
.nav-item svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-tg{width:46px;height:46px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-tg svg{width:24px;height:24px;fill:#000}
.empty-state{text-align:center;padding:80px 30px;color:#636366}
.empty-state svg{width:60px;height:60px;stroke:#333;stroke-width:1.5;fill:none;margin-bottom:20px}
.empty-state h3{font-size:18px;font-weight:700;color:#fff;margin-bottom:8px}
.empty-state p{font-size:13px;line-height:1.5}
.welcome{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 30px;z-index:9999;overflow:hidden}
.welcome-bg{position:absolute;inset:-50%;display:flex;flex-direction:column;gap:14px;transform:rotate(-10deg);opacity:.85;filter:contrast(1.1) saturate(1.2);pointer-events:none;z-index:1}
.welcome-row{display:flex;gap:14px;width:max-content;animation:scrollLeft 60s linear infinite;pointer-events:none}
.welcome-row.reverse{animation:scrollRight 70s linear infinite}
.welcome-row:nth-child(2){animation-duration:55s}
.welcome-row:nth-child(3){animation-duration:75s}
.welcome-row img{width:110px;height:165px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#1a1a1a;pointer-events:none}
@keyframes scrollLeft{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes scrollRight{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.welcome-overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.45) 0%,rgba(0,0,0,.92) 75%);z-index:2;pointer-events:none}
.welcome-content{position:relative;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;max-width:400px;pointer-events:auto}
.welcome-brand{font-size:44px;font-weight:900;letter-spacing:16px;margin-bottom:50px;text-shadow:0 6px 40px rgba(0,0,0,.95);text-align:center;padding-left:16px}
.welcome input{width:100%;max-width:340px;background:#1c1c1e;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:16px 20px;color:#fff;font-size:16px;outline:none;font-family:'Inter',sans-serif;margin-bottom:12px;text-align:center}
.welcome input::placeholder{color:#8e8e93}
.welcome .err{color:#ff453a;font-size:12px;margin-bottom:8px;height:16px}
.welcome button{width:100%;max-width:340px;background:#fff;color:#000;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:700;font-family:'Inter',sans-serif;box-shadow:0 8px 30px rgba(255,255,255,.2);margin-bottom:14px}
.welcome .welcome-hint{font-size:11px;color:#8e8e93;text-align:center;line-height:1.5;max-width:320px}
.about-hero-big{position:relative;width:calc(100% - 32px);margin:16px auto 20px;height:440px;background-size:cover;background-position:center;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.about-hero-big::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.3) 55%,rgba(0,0,0,.95) 100%)}
.about-hero-content{position:absolute;top:18px;left:0;right:0;text-align:center;z-index:2;padding:0 22px}
.about-logo{font-size:36px;font-weight:900;letter-spacing:14px;padding-left:14px;text-shadow:0 4px 30px rgba(0,0,0,.9)}
.social-list{padding:0 22px;display:flex;flex-direction:column;gap:12px;margin-bottom:50px}
.social-btn{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#0d0d0d;border:1px solid #1c1c1e;border-radius:18px;text-decoration:none;color:#fff;font-family:'Inter',sans-serif}
.social-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.social-icon.tg{background:linear-gradient(135deg,#2AABEE,#229ED9)}
.social-icon.fb{background:#1877F2}
.social-icon.tk{background:#111;border:1px solid #2c2c2e}
.social-icon svg{width:24px;height:24px;fill:#fff}
.social-info{flex:1;text-align:left}
.social-name{font-size:15px;font-weight:700}
.social-handle{font-size:12px;color:#8e8e93;margin-top:3px}
.social-arrow{color:#555;font-size:22px}
.admin-screen{position:fixed;inset:0;background:#000;z-index:9998;overflow-y:auto;padding:20px 22px 100px;display:none}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.admin-header h1{font-size:26px;font-weight:800}
.admin-close{width:36px;height:36px;border-radius:50%;background:#1c1c1e;border:none;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.admin-tabs{display:flex;gap:8px;margin-bottom:24px}
.admin-tab{padding:10px 18px;border-radius:20px;background:#1c1c1e;color:#8e8e93;font-size:13px;font-weight:600;border:none;font-family:'Inter',sans-serif}
.admin-tab.active{background:#fff;color:#000}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:700;colo
